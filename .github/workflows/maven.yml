# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: CI build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Maven build
        if: github.event_name != 'push'
        run: ./mvnw -B -U -T 1C clean install
      - name: Maven build and deploy snapshot to Maven Central
        if: github.event_name == 'push'
        run: ./mvnw -B -U -s .github/maven-settings.xml clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      - name: Set artifact name
        id: vars
        run: echo "ARTIFACT_NAME=${{ github.event.repository.name }}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vars.outputs.ARTIFACT_NAME }}
          path: '*/target/*.jar'
      - name: Upload build error artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maven-logs
          path: |
            */target/surefire-reports/
            */target/invoker-reports/
            */target/it/*/build.log
