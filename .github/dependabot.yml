# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
    commit-message:
      prefix: "chore"


  # Maintain dependencies for maven
  - package-ecosystem: "maven"
    directory: "/"
    open-pull-requests-limit: 99
    schedule:
      interval: "weekly"
    commit-message:
      include: "scope"
      prefix: "chore"
    ignore:
      # maven.version is the Maven API the plugin is compiled against, i.e. the lowest supported Maven line;
      # only take patch updates, raising the line is a deliberate decision (with <prerequisites> and the enforcer rule)
      - dependency-name: "org.apache.maven:maven-plugin-api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.apache.maven:maven-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
